# 业界简报：每天北京时间 8:20 左右抓机器人、具身智能和 AI 行业的新闻与深度文章。
# 14:20 再触发一次备用（GitHub 的定时任务偶尔会被跳过），当天已经生成过就直接跳过。
name: news

on:
  schedule:
    - cron: "20 0 * * *" # UTC 0:20 = 北京时间 8:20
    - cron: "20 6 * * *" # 备用：北京时间 14:20
  workflow_dispatch:

concurrency:
  group: robot-times-news
  cancel-in-progress: false

jobs:
  # 没配置云端版（比如只用本地版、或者刚 fork）时整个任务跳过，不会每天报错
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "没配置云端版（缺 D1_DATABASE_ID 等 Secrets），跳过。见 docs/dev/cloud-setup.md"; fi

  news:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: 生成今天的业界简报
        run: uv run --no-sync robot-times cloud news ${{ github.event_name == 'schedule' && '--if-missing' || '' }}
