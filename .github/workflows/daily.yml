# 每日推荐：工作日北京时间 9:40 左右运行（GitHub 的定时任务经常晚几分钟到半小时）。
# arXiv 在美东时间晚上 8 点发布新论文（北京时间早上 8 点，冬令时 9 点），周五、周六晚上不发布，
# 所以周一到周五跑，每次拿到的都是当天早上刚发布的那批。
# 需要的 Secrets 见 docs/dev/cloud-setup.md。也可以在 Actions 页面手动运行。
name: daily

on:
  schedule:
    - cron: "40 1 * * 1-5" # UTC 周一到周五 1:40 = 北京时间 9:40
    # 备用：GitHub 的定时任务偶尔会被跳过。11:40 再触发一次，早上已经跑过就直接跳过
    - cron: "40 3 * * 1-5"
  workflow_dispatch:
    inputs:
      day:
        description: "按哪一天生成（YYYY-MM-DD），留空就是今天"
        required: false
        default: ""
      analyze_only:
        description: "只给这一天已有的推荐重写解读，不重新选论文"
        type: boolean
        required: false
        default: false

concurrency:
  group: robot-times-cloud
  cancel-in-progress: false

jobs:
  # 没配置云端版（比如只用本地版、或者刚 fork）时整个任务跳过，不会每天报错
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "没配置云端版（缺 D1_DATABASE_ID 等 Secrets），跳过。见 docs/dev/cloud-setup.md"; fi

  daily:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（PyTorch 用 CPU 版，体积小得多）
        run: |
          uv sync --locked
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "sentence-transformers>=3.0"
      - name: 缓存向量模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: 只补写解读
        if: ${{ inputs.analyze_only }}
        run: uv run --no-sync robot-times cloud analyze --force --day "${{ inputs.day }}"
      - name: 生成今日推荐
        if: ${{ !inputs.analyze_only }}
        run: uv run --no-sync robot-times cloud daily --day "${{ inputs.day }}" ${{ github.event_name == 'schedule' && '--if-missing' || '' }}
