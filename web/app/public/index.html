function suDraft(){
  const g=id=>document.getElementById(id);
  if(g("su-int")) SU.draft.interests=g("su-int").value;
  if(g("su-cats")) SU.draft.categories=g("su-cats").value;
  if(g("su-folder")) SU.draft.zoteroCollection=g("su-folder").value;
  if(g("su-key")) SU.draft.key=g("su-key").value;
  if(g("su-base")) SU.draft.base=g("su-base").value;
  if(g("su-model")) SU.draft.model=g("su-model").value;
}
async function suAction(what){
  suDraft(); SU.err={};
  const d=SU.draft;
  const run=async(name, fn)=>{ SU.busy=name; render(); try{ await fn(); }catch(e){ SU.err[name]=e.message; } finally{ SU.busy=""; await loadSetup(); render(); } };
  if(what==="reopen"){  // 设置页里重新打开引导：重新连 Zotero、换大模型
    Object.assign(SU,{st:null, folders:null, draft:{}, llmOk:false, llmSkip:false}); S.setup={done:false, reopened:true};
    window.scrollTo(0,0); return render();
  }
  if(what==="cancel"){ clearInterval(SU.timer); SU.timer=null; S.setup={done:true}; return render(); }
  if(what==="recheck") return run("recheck", async()=>{});
  if(what==="enable") return run("enable", async()=>{ await api("/api/setup/enable-api",{method:"POST"}); toast("已经打开了，现在重新打开 Zotero"); });
  if(what==="auth") return run("auth", async()=>{ await api("/api/setup/authorize",{method:"POST"}); SU.folders=null; S.features.zotero=true; toast("连上了"); });
  if(what==="skip"){ SU.llmSkip=true; return render(); }
  if(what==="llm") return run("llm", async()=>{ await api("/api/setup/llm",{method:"PUT", body:JSON.stringify({key:d.key, base:d.base, model:d.model})}); SU.llmOk=true; S.features.ask=true; toast("大模型能用了"); });
  if(what==="finish") return run("finish", async()=>{
    const cats=(d.categories||"").split(/[，,、\s]+/).map(x=>x.trim()).filter(Boolean);
    await api("/api/setup/finish",{method:"POST", body:JSON.stringify({interests:d.interests ?? SU.st.settings.interests, zoteroCollection:d.zoteroCollection ?? SU.st.settings.zoteroCollection ?? "", ...(cats.length?{categories:cats}:{})})});
    clearInterval(SU.timer); SU.timer=null; S.setup=null;
    await loadAll(); S.tab="today"; showJob(); watchJob(); toast("开始生成今天的推荐了，第一次要几分钟");
  });
}

function versionSection(){
  const u=S.update; if(!u) return "";
  const latest=u.latest?.version;
  const line = u.available ? `有新版本 <b>v${esc(latest)}</b>`+(u.latest?.url?`（<a href="${esc(u.latest.url)}" target="_blank" rel="noopener">更新内容</a>）`:"") : "已经是最新版本";
  const act = u.available ? (u.method==="fork"
      ? (u.syncUrl?`<a class="btn" href="${esc(u.syncUrl)}" target="_blank" rel="noopener">去 GitHub 同步</a>`:"")
      : u.method==="none" ? `<span class="small faint">这份代码不是用安装脚本装的，请自己 git pull</span>` : `<button class="btn pri" data-upd="go">更新</button>`) : "";
  return `<section class="section"><h2>版本</h2>
      <p>当前 <b>v${esc(u.current)}</b>，${line}。</p>
      ${u.method==="fork"?`<p class="small faint">云端版的代码在你 fork 的仓库里：有新版本时到 GitHub 上你的仓库页面点 <b>Sync fork</b>，Cloudflare 会自动重新部署。</p>`:""}
      ${isLocal()?`<label class="optrow"><input type="checkbox" id="cfg-auto" ${u.auto?"checked":""}> 自动更新（有新版本时，在看板 10 分钟没人用、也没在生成推荐的时候自动更新）</label>`:""}
      <div class="actions">${act}${isLocal()?`<button class="btn" data-upd="check">检查更新</button>`:""}</div></section>`;
}

/* 新版本提示：报头下面一条，点“以后再说”这个版本就不再提示 */
function showUpdate(){
  const el=$("#updbar"), u=S.update;
  let skip=""; try{ skip=localStorage.getItem("upd-skip")||""; }catch{}
  if(u && (u.state==="updating"||u.state==="restarting")){
    el.innerHTML=`<span class="dot" aria-hidden="true"></span><span>正在更新到 v${esc(u.latest?.version||"")}……大约一分钟，好了页面会自动刷新。</span>`;
    el.hidden=false; return;
  }
  if(u && u.state==="failed"){
    el.innerHTML=`<span>更新没成功：${esc(u.error||"")}。现在用的还是 v${esc(u.current)}。</span><span class="acts"><button class="btn link" data-upd="close">知道了</button></span>`;
    el.hidden=false; return;
  }
  if(!u || !u.available || skip===u.latest.version){ el.hidden=true; return; }
  const go = u.method==="fork" ? (u.syncUrl?`<a class="btn" href="${esc(u.syncUrl)}" target="_blank" rel="noopener">去 GitHub 同步</a>`:"")
    : u.method==="none" ? "" : `<button class="btn pri" data-upd="go">更新</button>`;
  el.innerHTML=`<span style="flex:1 1 320px">有新版本 <b>v${esc(u.latest.version)}</b>（现在是 v${esc(u.current)}）${u.latest.notes?`<details><summary class="small">更新内容</summary><div class="updnotes">${esc(u.latest.notes)}</div></details>`:""}</span><span class="acts">${go}<button class="btn link" data-upd="skip">以后再说</button></span>`;
  el.hidden=false;
}
let updTimer=null;
async function startUpdate(){
  try{ S.update=await api("/api/update",{method:"POST"}); }
  catch(e){ toast(e.message); return; }
  showUpdate(); watchUpdate();
}
function watchUpdate(){
  if(updTimer) return;
  const want=S.update?.latest?.version;
  updTimer=setInterval(async()=>{
    try{
      const u=await api("/api/update");
      if(u.current===want){ clearInterval(updTimer); updTimer=null; toast(`已更新到 v${want}`); setTimeout(()=>location.reload(),800); return; }
      S.update=u; showUpdate();
      if(u.state==="failed"){ clearInterval(updTimer); updTimer=null; }
    }catch{ /* 看板正在重启，接着等 */ }
  }, 3000);
}

function closeWxPop(){ document.querySelector(".wxpop")?.remove(); document.removeEventListener("click", wxOutside, true); document.removeEventListener("keydown", wxKey, true); }

function openWxPop(btn){

async function wxSearch(name){

/* 实时天气：浏览器定位后直接查 Open-Meteo（免费、不用密钥），城市名用 BigDataCloud 的免费反查。
   位置只在你自己的浏览器里用，不存到服务器；每 30 分钟刷新一次，结果在本机缓存半小时。
   不给定位或者查不到时，用每天早上按设置里的城市抓的预报（S.weather 里原来那份）；城市也没填就不显示。 */
const WX_CODES={0:["晴","sun"],1:["晴间多云","partly"],2:["多云","partly"],3:["阴","cloud"],45:["雾","fog"],48:["雾凇","fog"],
  51:["毛毛雨","rain"],53:["毛毛雨","rain"],55:["毛毛雨","rain"],56:["冻毛毛雨","rain"],57:["冻毛毛雨","rain"],61:["小雨","rain"],63:["中雨","rain"],65:["大雨","rain"],
  66:["冻雨","rain"],67:["冻雨","rain"],71:["小雪","snow"],73:["中雪","snow"],75:["大雪","snow"],77:["雪粒","snow"],80:["阵雨","rain"],81:["阵雨","rain"],82:["强阵雨","rain"],
  85:["阵雪","snow"],86:["强阵雪","snow"],95:["雷阵雨","storm"],96:["雷阵雨伴冰雹","storm"],99:["雷阵雨伴冰雹","storm"]};
function wxCache(v){ try{ if(v) localStorage.setItem("wx",JSON.stringify(v)); else return JSON.parse(localStorage.getItem("wx")||"null"); }catch{ return null; } }
function locate(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(3), lon:+p.coords.longitude.toFixed(3)}), ()=>res(null), {maximumAge:30*60e3, timeout:10000});
  });
}
async function cityName(lat, lon){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
    const d=await r.json();
    return String(d.city||d.locality||d.principalSubdivision||"").replace(/市$/,"") || "当前位置";
  }catch{ return "当前位置"; }
}
function wxPlace(v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem("wx-place")||"null"); if(v) localStorage.setItem("wx-place",JSON.stringify(v)); else localStorage.removeItem("wx-place"); localStorage.removeItem("wx"); }catch{ return null; } }
async function liveWeather(force){
  const cached=wxCache();
  if(!force && cached && Date.now()-cached.at<30*60e3){ S.weather=cached.w; renderChrome(); return; }
  const place=wxPlace();
  const pos=place ? null : await locate();
  const at=place||pos;
  if(!at) return; // 没有定位也没输入地点：用每天早上那份
  try{
    const qs=new URLSearchParams({latitude:at.lat, longitude:at.lon, current:"temperature_2m,weather_code,is_day",
      daily:"temperature_2m_max,temperature_2m_min,precipitation_probability_max", timezone:"auto", forecast_days:"1"});
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?${qs}`);
    if(!r.ok) throw new Error(r.status);
    const d=await r.json(), c=d.current||{};
    let [text, kind]=WX_CODES[c.weather_code]||["多云","cloud"];
    if(!c.is_day && (kind==="sun"||kind==="partly")) kind = kind==="sun" ? "moon" : "cloud";
    const w={live:true, city: place ? place.name : await cityName(at.lat, at.lon), text, kind,
      temp:Math.round(c.temperature_2m), tmax:Math.round(d.daily.temperature_2m_max[0]), tmin:Math.round(d.daily.temperature_2m_min[0]),
      pop:d.daily.precipitation_probability_max?.[0]??null};
    S.weather=w; wxCache({at:Date.now(), w}); renderChrome();
  }catch(e){ /* 查不到就保留每天早上那份预报 */ }
}
function renderChrome(){

function watchReveal(root, scroller){
  if(readerIO) readerIO.disconnect();
  const els=[...root.querySelectorAll(".rv:not(.in)")];
  if(!motionOK()||!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  readerIO=new IntersectionObserver(ents=>{ for(const en of ents) if(en.isIntersecting){ en.target.classList.add("in"); readerIO.unobserve(en.target); } },{root:scroller, rootMargin:"0px 0px -8% 0px"});
  els.forEach(e=>readerIO.observe(e));
}

const pending={}, chain={}, timers={};
function patchNote(id, patch, delay){
  S.notes={...S.notes,[id]:{status:"todo",note:"",flags:[],...noteOf(id), ...patch, paperId:id, updatedAt:new Date().toISOString()}};
  pending[id]=true; const sv=$("#saved"); if(sv&&S.open===id) sv.textContent="保存中…";
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>flush(id), delay||0);
}
function flush(id){
  const n=S.notes[id], body=JSON.stringify({status:n.status, note:n.note, flags:n.flags});
  chain[id]=(chain[id]||Promise.resolve()).then(()=>api(`/api/notes/${encodeURIComponent(id)}`,{method:"PUT", body})).then(saved=>{
    pending[id]=false; S.notes[id]={...S.notes[id], updatedAt:saved.updatedAt};
    const sv=$("#saved"); if(sv&&S.open===id) sv.textContent="已保存";
  }).catch(e=>{ pending[id]=false; const sv=$("#saved"); if(sv) sv.textContent="没保存上"; toast(e.message); });
}
window.addEventListener("beforeunload", e=>{ if(Object.values(pending).some(Boolean)){ e.preventDefault(); e.returnValue=""; } });

async function addZotero(id){
  id=id||S.open; if(!id||zBusy) return;
  if(pending[id]){ clearTimeout(timers[id]); flush(id); await chain[id]; }

  try{
    const r=await api(`/api/zotero/${encodeURIComponent(id)}`,{method:"POST"});

async function sendFeedback(id, action, quiet){

async function runAI(kind){
  const id=S.open, n=noteOf(id);
  if(kind==="check"&&!(n.note||"").trim()){ toast("先写几句笔记，再让 AI 检查。"); return; }
  const out=$("#ai-out"), stop=$("#ai-stop"), save=$("#ai-save"), ask=$("#ai-ask"), chk=$("#ai-check"), note=$("#ai-note");
  aiCtl=new AbortController(); out.hidden=false; out.textContent="正在想…"; stop.hidden=false; save.hidden=true; ask.disabled=chk.disabled=true; note.textContent=""; aiText="";
  try{
    const resp=await fetch("/api/ask",{method:"POST", signal:aiCtl.signal, headers:{"content-type":"application/json"},
      body:JSON.stringify({paperId:id, kind, question:$("#ai-q").value.trim(), context:$("#ai-ctx").value, note:n.note||""})});
    if(!resp.ok){ let msg=`HTTP ${resp.status}`; try{ msg=(await resp.json()).error||msg; }catch{} throw new Error(msg); }
    const reader=resp.body.getReader(), dec=new TextDecoder(); let buf="";
    for(;;){
      const {value, done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith("data:")) continue;
        const data=line.slice(5).trim(); if(data==="[DONE]") continue;
        try{ aiText+=JSON.parse(data).choices?.[0]?.delta?.content||""; }catch{}
      }
      if(S.open===id) out.textContent=aiText||"正在想…";
    }
    if(S.open===id&&aiText) save.hidden=false;
  }catch(e){
    if(S.open!==id) return;
    if(e.name!=="AbortError") note.textContent=e.message||"回答中断了，可以再试一次。";
    if(aiText) save.hidden=false; else out.hidden=true;
  }finally{ if(S.open===id){ stop.hidden=true; ask.disabled=chk.disabled=false; } aiCtl=null; }
}

const jobBusy = j => !!(j && (j.running || (j.queue||[]).length));

  if(d.su) return suAction(d.su);
  if(d.upd==="go") return startUpdate();
  if(d.upd==="skip"){ try{ localStorage.setItem("upd-skip", S.update?.latest?.version||""); }catch{} return showUpdate(); }
  if(d.upd==="close"){ $("#updbar").hidden=true; return; }
  if(d.upd==="check"){ api("/api/update?check=1").then(u=>{ S.update=u; render(); showUpdate(); toast(u.available?`有新版本 v${u.latest.version}`:"已经是最新版本"); }).catch(e=>toast(e.message)); return; }
  if(d.run) return runJob(d.run, t);
  if(t.id==="z-add") return addZotero();
  if(t.id==="z-del") return removeZotero();
  if(t.id==="lib-more") return loadLib(true);
  if(t.id==="ai-ask") return runAI("ask");
  if(t.id==="ai-check") return runAI("check");
  if(t.id==="ai-stop"){ aiCtl?.abort(); return; }
  if(t.id==="ai-save"&&S.open&&aiText){ const n=noteOf(S.open).note||""; const stamp=new Date().toISOString().slice(0,10);
    const v=(n?n+"\n\n":"")+`[AI 解读 ${stamp}]\n`+aiText; patchNote(S.open,{note:v}); const ta=$("#note-ta"); if(ta) ta.value=v; $("#ai-save").hidden=true; toast("已存入笔记"); return; }
  if(t.id==="cfg-save") return saveCfg();
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id&&t.id.startsWith("su-")){ suDraft(); return; }
  if(t.id==="note-ta"&&S.open){ patchNote(S.open,{note:t.value},900); return; }
  if(t.id==="lib-q"){ S.lib.q=t.value; clearTimeout(libTimer); libTimer=setTimeout(()=>loadLib(),300); return; }
  if(t.id==="cfg-auto"){ api("/api/config",{method:"PUT", body:JSON.stringify({autoUpdate:t.checked})}).then(s=>{ S.settings=s; if(S.update) S.update.auto=t.checked; toast(t.checked?"已打开自动更新":"已关掉自动更新"); }).catch(e=>toast(e.message)); return; }
  if(t.id==="cfg-div"){ $("#cfg-div-v").textContent=(+t.value).toFixed(1); return; }
  if(t.id?.startsWith("w-")){ const k=t.id.slice(2), w={...weights(), [k]:+t.value}; S.wDraft=w;
    $("#wv-"+k).textContent=(+t.value).toFixed(2); $("#formula").textContent=formula(w); }
});
document.addEventListener("keydown", e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"");
  if(S.open){
    if(e.key==="Escape"){ closeReader(); return; }
    if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==="ArrowRight"){ navReader(1); e.preventDefault(); }
    if(e.key==="ArrowLeft"){ navReader(-1); e.preventDefault(); }
    return;
  }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="j"||e.key==="k"){ // 在本页的论文标题之间移动
    const items=[...document.querySelectorAll("#main .hit")];
    if(!items.length) return;
    const i=items.indexOf(document.activeElement);
    const nx=items[Math.max(0,Math.min(items.length-1, i<0?0:i+(e.key==="j"?1:-1)))];
    nx.focus(); nx.scrollIntoView({block:"center", behavior:smooth()}); e.preventDefault();
  }
});
new IntersectionObserver(([en])=>{ const sl=$("#slim"), on=!en.isIntersecting; sl.classList.toggle("on",on); sl.inert=!on; },{rootMargin:"-60px 0px 0px 0px"}).observe($("#mast"));

/* ---------- 启动 ---------- */
renderChrome();
/* 第一次打开时提示收藏或安装成应用（关掉后不再出现）。浏览器不允许网页自己加收藏，只能提示 */
let installEvt=null;
addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt=e; showHint(); });
function showHint(){
  const el=$("#hintbar");
  let off=false; try{ off=localStorage.getItem("hint-install")==="off"; }catch{}
  if(off || matchMedia("(display-mode: standalone)").matches || navigator.standalone){ el.hidden=true; return; }
  const ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua), mobile=/Android|iPhone|iPad|iPod/.test(ua), mac=/Mac/.test(navigator.platform||ua);
  const tip = ios ? "把它放到主屏幕：点 Safari 下面的分享按钮，再点“添加到主屏幕”。"
    : mobile ? "把它放到主屏幕：点浏览器菜单里的“添加到主屏幕”或“安装应用”。"
    : `收藏这个页面，以后一点就开：按 <kbd>${mac?"⌘":"Ctrl"}</kbd>+<kbd>D</kbd>。`+(installEvt?"也可以安装成一个单独的应用，在程序坞或开始菜单里打开。":"");
  el.innerHTML=`<span>${tip}</span><span class="acts">${installEvt?`<button class="btn" id="hint-install">安装成应用</button>`:""}<button class="btn link" id="hint-close">知道了</button></span>`;
  el.hidden=false;
  const inst=$("#hint-install");
  if(inst) inst.onclick=async()=>{ installEvt.prompt(); const r=await installEvt.userChoice; installEvt=null; if(r.outcome==="accepted") hideHint(); else showHint(); };
  $("#hint-close").onclick=hideHint;
}
function hideHint(){ try{ localStorage.setItem("hint-install","off"); }catch{} $("#hintbar").hidden=true; }

async function loadAll(){
  const b=await api("/api/bootstrap");
  Object.assign(S,{me:b.me, mode:b.mode||"cloud", job:b.job||null, update:b.update||null, setup:(S.setup?.reopened && !S.setup.done) ? S.setup : (b.setup||null), settings:b.settings, features:b.features||{}, days:b.days||[], weeks:b.weeks||[],
    notes:b.notes||{}, papers:b.papers||{}, zotero:b.zotero||{}, feedback:b.feedback||{}, ready:true,
    news:b.news||null, newsDates:b.newsDates||[], weather:S.weather?.live?S.weather:(b.weather||S.weather||null), site:b.site||null});
  if(b.news) S.newsCache[b.news.date]=b.news;
}
(async()=>{
  try{ await loadAll(); showJob(); if(jobBusy(S.job)) watchJob(); showHint(); showUpdate(); if(["updating","restarting"].includes(S.update?.state)) watchUpdate(); }
  catch(e){ S.error=e.message; }
  liveWeather();
  setInterval(()=>{ if(!document.hidden) liveWeather(true); }, 30*60e3);
  document.body.classList.add("intro");
  render();
  setTimeout(()=>document.body.classList.remove("intro"),1500);
})();
})();
</script>
