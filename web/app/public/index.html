<style>
/* The Robot Times·早报版式
   参照严肃出版物的版面：报头 + 双线、头条通栏、主稿与简讯分栏、细线分隔、一种强调色（深红）。
   层级靠字号、字重和版面位置区分，不靠彩色卡片。 */
:root{
  --paper:#FFFFFF; --paper-2:#F7F7F5; --ink:#121212; --text:#2B2B2B; --mute:#5A5A5A; --faint:#8B8B8B;
  --masthead:"UnifrakturMaguntia","Old English Text MT",serif;
  --rule:#E2E2E2; --rule-strong:#121212; --accent:#121212; --accent-soft:#F3F3F3; --on-accent:#FFFFFF;
  --zh-display:"Noto Serif SC","Songti SC","STSong",serif;
  --serif:"Newsreader","Noto Serif SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --col:1180px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121212; --paper-2:#1B1B1B; --ink:#F4F4F4; --text:#DCDCDC; --mute:#A2A2A2; --faint:#767676;
  --rule:#323232; --rule-strong:#EDEDED; --accent:#EDEDED; --accent-soft:#242424; --on-accent:#121212; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121212; --paper-2:#1B1B1B; --ink:#F4F4F4; --text:#DCDCDC; --mute:#A2A2A2; --faint:#767676;
  --rule:#323232; --rule-strong:#EDEDED; --accent:#EDEDED; --accent-soft:#242424; --on-accent:#121212; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--col);margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* 标题悬停：下划线从左往右画出来 */
.ul{background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-position:0 100%;background-repeat:no-repeat;transition:background-size .35s cubic-bezier(.2,.7,.2,1);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hit:hover .ul,.hit:focus-visible .ul,.ul:hover{background-size:100% 1px}
.hit{all:unset;cursor:pointer;display:inline}
.hit:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* 报头 */
.mast{padding-top:env(safe-area-inset-top,0px)}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;font-size:13px;color:var(--mute)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:none;padding:4px 10px;cursor:pointer;color:var(--mute);font-size:14px;white-space:nowrap;position:relative}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:2px;background:var(--accent)}
.mast-title{text-align:center;padding:10px 0 6px}
.mast-title h1{margin:0;font-family:var(--masthead);font-weight:400;font-size:clamp(60px,9vw,104px);line-height:1;letter-spacing:.06em;padding-left:.06em;color:var(--ink)}
.mast-sub{display:flex;justify-content:space-between;align-items:center;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--mute);padding:7px 0;border-top:1px solid var(--rule-strong);letter-spacing:.02em}
.mast-sub span{min-width:0}
.mast-sub .mid{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--text)}
/* 今日以外的页面用小一号的报头，把版面留给内容 */
body:not(.tab-today) .mast-title{padding:6px 0 4px}
body:not(.tab-today) .mast-title h1{font-size:clamp(40px,4.4vw,52px)}
body:not(.tab-today) .mast-sub{display:none}
body:not(.tab-today) .rules{height:4px}
.rules{height:4px;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong)}
@media (max-width:640px){.mast-top{flex-direction:column-reverse;align-items:stretch;gap:6px}.nav{margin:0 -10px}.mast-sub{justify-content:center;text-align:center}.mast-sub .hide-sm{display:none}}

/* 往下滚动后出现的窄条 */
.slim{position:fixed;top:0;left:0;right:0;z-index:15;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);transform:translateY(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px)}
.slim.on{transform:none}
.slim .wrap{display:flex;align-items:center;gap:18px;height:48px}
.slim b{font-family:var(--masthead);font-weight:400;font-size:26px;letter-spacing:0;color:var(--ink);line-height:1;white-space:nowrap}
.slim .nav{margin-left:auto}
@media (max-width:640px){.slim .nav button{padding:4px 7px;font-size:13.5px}}

main{padding:22px 0 80px}

/* 通用小件 */
.kicker{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:0}
.kicker .min{font-weight:400;letter-spacing:0;color:var(--faint);margin-left:10px}
.meta{font-size:12.5px;color:var(--mute);line-height:1.6}
.meta .v{color:var(--ink)}
.mute{color:var(--mute)} .faint{color:var(--faint)} .small{font-size:13px}
.warn{font-size:13px;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:none;color:var(--ink);padding:6px 14px;cursor:pointer;font-size:13.5px;line-height:1.4;text-decoration:none;border-radius:0;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.link{border-color:transparent;padding-inline:4px;color:var(--mute)}
.btn.link:hover{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:none;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.stamp{display:inline-block;font-size:11.5px;font-weight:500;letter-spacing:.06em;padding:0 6px;line-height:19px;border:1px solid currentColor;white-space:nowrap;vertical-align:3px;margin-left:8px;font-family:var(--sans)}
.stamp.reading{color:var(--accent)} .stamp.done{color:var(--mute)} .stamp.z{color:var(--faint)} .stamp.skip{color:var(--faint)}

/* 已读勾选 */
.check{flex:none;width:20px;height:20px;border:1.5px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:3px;transition:background .15s,border-color .15s}
.check svg{width:12px;height:12px;opacity:0;stroke:var(--paper);transition:opacity .15s}
.check:hover{border-color:var(--ink)}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.check[aria-pressed="true"] svg{opacity:1}
.check.half{border-color:var(--accent);background:linear-gradient(135deg,var(--accent) 50%,transparent 50%)}

/* 首页：头条区 */
.edition{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:14px}
.pager{display:inline-flex;align-items:center;gap:4px}
.pager button{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px 6px;font-size:13px}
.pager button:hover:not(:disabled){color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pager button:disabled{opacity:.35;cursor:default}
.pager b{color:var(--ink);font-weight:500}
.banner{font-family:var(--zh-display);font-weight:900;font-size:clamp(28px,4.2vw,44px);line-height:1.22;letter-spacing:0;color:var(--ink);margin:0 0 14px;text-wrap:balance;max-width:20em}
.dek{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--mute);max-width:40em}
.dayhead{padding-bottom:22px;border-bottom:1px solid var(--rule)}

/* 时间条：像数据图一样的阅读进度 */
.strip{padding:16px 0 18px;border-bottom:1px solid var(--rule-strong)}
.strip-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;color:var(--mute);margin-bottom:8px}
.strip-top b{color:var(--ink);font-weight:500;font-size:14px}
.bars{display:flex;gap:10px}
.bar{all:unset;cursor:pointer;display:grid;gap:6px;min-width:0}
.cells{display:flex;gap:2px;height:10px}
.cells i{flex:1;background:var(--rule);transition:background .4s ease}
.cells i.on{background:var(--ink)}
.bar.deep .cells i.on{background:var(--accent)}
.bar-label{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-label b{color:var(--ink);font-weight:500;margin-right:4px}
.bar:hover .bar-label b,.bar:focus-visible .bar-label b{text-decoration:underline;text-underline-offset:3px}
.bar .short{display:none}
@media (max-width:640px){.bars{gap:6px}.bar-label .m{display:none}.bar .full-name{display:none}.bar .short{display:inline}}

/* 首页主体：头条 + 简讯 */
.front{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:0 40px;padding-top:26px}
.front>*{min-width:0}
.briefs{border-left:1px solid var(--rule);padding-left:28px}
@media (max-width:980px){.front{grid-template-columns:minmax(0,1fr)}.briefs{border-left:0;padding-left:0;border-top:1px solid var(--rule-strong);padding-top:20px;margin-top:34px}}

.lead{display:grid;gap:12px;padding-bottom:28px}
.lead h3{margin:2px 0 0;font-family:var(--serif);font-weight:700;font-size:clamp(26px,2.8vw,34px);line-height:1.16;letter-spacing:-.01em;color:var(--ink);text-wrap:balance;font-variation-settings:"opsz" 72}
.lead .lede{font-family:var(--serif);font-size:17px;line-height:1.72;color:var(--text);max-width:36em}
.pull{margin:2px 0;padding:0 0 0 16px;border-left:3px solid var(--accent);font-family:var(--serif);font-size:16px;line-height:1.65;color:var(--ink);max-width:38em}
.pull small{display:block;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:1px}
.howto{font-size:13.5px;line-height:1.6;color:var(--mute);max-width:44em}
.howto b{color:var(--ink);font-weight:700;margin-right:6px}
.lead-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-top:4px}
.lead-foot .score{margin-left:auto}
.score{font-size:12.5px;color:var(--faint);white-space:nowrap;cursor:help}
.score b{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);margin-right:3px;font-variant-numeric:tabular-nums lining-nums}

/* 配图：论文原图放在白底框里（多是示意图，不裁切）；新闻照片铺满 */
.lead-fig{margin:4px 0 2px}
.lead-fig .img,.thumb{all:unset;cursor:pointer;display:block;background:#fff;border:1px solid var(--rule);overflow:hidden;box-sizing:border-box}
.lead-fig .img{display:flex;justify-content:center;padding:10px 0}
.lead-fig img{display:block;max-width:100%;height:auto;max-height:440px;object-fit:contain;background:#fff;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.lead-fig .img:hover img,.thumb:hover img{transform:scale(1.015)}
.lead-fig figcaption{font-size:12px;line-height:1.55;color:var(--mute);margin-top:6px}
.lead-fig .credit{display:block;color:var(--faint);font-size:11px;letter-spacing:.02em;margin-top:2px}
.thumb{aspect-ratio:16/9;margin-bottom:10px}
.thumb img{display:block;width:100%;height:100%;object-fit:contain;background:#fff;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.item .thumb{aspect-ratio:3/2;margin-bottom:8px;border:0}
.item .thumb img{object-fit:cover}

/* 看摘要：四栏，细竖线分隔 */
.second{border-top:1px solid var(--rule-strong);padding-top:14px;margin-top:6px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.story{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;padding:14px 22px 18px 0;border-bottom:1px solid var(--rule)}
.cols .story:nth-child(2n){padding-left:22px;padding-right:0;border-left:1px solid var(--rule)}
.story-h{display:flex;gap:10px;align-items:flex-start}
.story h4{margin:0;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.25;color:var(--ink);letter-spacing:-.005em}
.story .sum{font-size:14.5px;line-height:1.65;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story .why{font-size:13px;line-height:1.55;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-meta{display:flex;align-items:baseline;gap:12px}
.story-meta .meta{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story .why::before{content:"";display:inline-block;width:14px;height:1px;background:var(--accent);vertical-align:4px;margin-right:8px}
.story.read h4,.brief.read .t{color:var(--faint)}
.zh-sub{font-family:var(--zh-display);font-size:14.5px;line-height:1.5;color:var(--mute);margin-top:3px;letter-spacing:0}
.lead .zh-sub{font-size:17px;color:var(--mute);margin-top:-4px}
.brief .zh-sub{font-size:13.5px;margin-top:2px}
@media (max-width:700px){.cols{grid-template-columns:minmax(0,1fr)}.cols .story:nth-child(2n){padding-left:0;border-left:0}.story{padding-right:0}}

/* 简讯：编号列表 */
.briefs ol{list-style:none;margin:10px 0 0;padding:0;counter-reset:b}
.brief{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--rule);counter-increment:b}
.brief:first-child{padding-top:6px}
.brief .n{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.1;color:var(--accent);font-variant-numeric:lining-nums}
.brief .n::before{content:counter(b)}
.brief .t{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.3;color:var(--ink)}
.brief .why{font-size:13px;line-height:1.55;color:var(--mute);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brief .row2{display:flex;align-items:center;gap:10px;margin-top:6px}
.brief .row2 .score{margin-left:auto}
.brief .check{width:18px;height:18px;margin-top:0}
.brief.skipped .t{text-decoration:line-through;text-decoration-thickness:1px;color:var(--faint)}
.x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.x:hover{color:var(--accent);text-decoration-color:currentColor}
.note-cta{font-size:13px;color:var(--mute)}

/* 业界：深度占大版面（头条一篇 + 下面一排卡片），快讯缩成并排的小块 */
.deep-sect{margin-top:0}
.dlead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:0 28px;padding:4px 0 24px;border-bottom:1px solid var(--hair)}
.dlead.noimg{grid-template-columns:minmax(0,1fr)}
.dl-text{display:grid;gap:10px;align-content:start}
.dl-text .hl{font-size:30px}
.dl-img{display:block;aspect-ratio:3/2;overflow:hidden;background:var(--paper-2)}
.dl-img img{display:block;width:100%;height:100%;object-fit:cover}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-top:20px}
.dcard{display:grid;gap:8px;align-content:start;padding:0 20px;border-left:1px solid var(--hair)}
.dcard:first-child{padding-left:0;border-left:0}
.dcard .cimg{margin-bottom:4px}
.dcard .isum{-webkit-line-clamp:4}
.ngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nb{display:grid;gap:6px;align-content:start;padding:16px 20px 18px;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.nb:nth-child(4n+1){padding-left:0;border-left:0}
.nb:nth-child(4n){padding-right:0}
.nb .ht{font-size:16.5px;line-height:1.35}
.nb .isum{font-size:14px;line-height:1.55;-webkit-line-clamp:3}
.nb .mline a{color:var(--c-meta)}
@media (max-width:1000px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:20px}.dcard:nth-child(3){padding-left:0;border-left:0}.ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}.nb:nth-child(n){padding:16px 20px 18px;border-left:1px solid var(--hair)}.nb:nth-child(2n+1){padding-left:0;border-left:0}.nb:nth-child(2n){padding-right:0}}
@media (max-width:700px){.dlead{grid-template-columns:minmax(0,1fr)}.dl-img{order:-1;margin-bottom:12px}.dgrid{grid-template-columns:minmax(0,1fr)}.dcard{padding:16px 0!important;border-left:0!important;border-bottom:1px solid var(--hair)}.ngrid{grid-template-columns:minmax(0,1fr)}.nb:nth-child(n){padding:14px 0;border-left:0}}

/* 本周 */
.wk-stats{font-size:14px;color:var(--mute);margin-top:12px}
.wk-stats b{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600;margin:0 2px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));border-top:1px solid var(--rule-strong);margin-top:28px}
.theme{padding:16px 24px 22px 0;display:grid;gap:8px;align-content:start;border-bottom:1px solid var(--rule)}
.theme+.theme{padding-left:24px;border-left:1px solid var(--rule)}
.theme h3{margin:0;font-family:var(--zh-display);font-weight:900;font-size:19px;line-height:1.35;color:var(--ink)}
.theme p{font-size:14.5px;line-height:1.65;color:var(--text)}
.refs{display:grid;gap:4px;margin-top:4px}
.refs .hit{display:block;position:relative;padding-left:14px;font-family:var(--serif);font-size:14.5px;line-height:1.45;color:var(--ink)}
.refs .hit::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:1px;background:var(--accent)}
@media (max-width:700px){.theme+.theme{padding-left:0;border-left:0}}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--rule-strong);padding-top:12px;margin-top:40px}
.section-h h2{margin:0;font-family:var(--zh-display);font-weight:900;font-size:24px;color:var(--ink)}
.section-h span{font-size:13px;color:var(--mute)}
table.plan{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.plan th{text-align:left;font-weight:500;font-size:12.5px;color:var(--mute);padding:8px 12px 8px 0;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
.plan td{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.plan td.d{white-space:nowrap;font-weight:500;color:var(--ink)}
.plan td.d span{display:block;font-weight:400;color:var(--faint);font-size:12.5px}
.plan td.k{white-space:nowrap;color:var(--mute)}
.plan td.k.deep{color:var(--accent);font-weight:700}
.plan td.m{text-align:right;white-space:nowrap;color:var(--mute);padding-right:0}
.plan .hit{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.4}
.plan td.p>.hit,.plan td.p>.mute{display:block}
.plan td.p>.hit+.hit{margin-top:4px}
.plan tr.weekend td{color:var(--faint)}
@media (max-width:640px){.plan th.k,.plan td.k{display:none}.plan td.p .kk{display:block;font-size:12px;color:var(--accent)}}
.plan .kk{display:none}
.ranked{list-style:none;margin:0;padding:0;counter-reset:r}
.ranked li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--rule);counter-increment:r;align-items:baseline}
.ranked li::before{content:counter(r);font-family:var(--serif);font-size:19px;font-weight:600;color:var(--accent);font-variant-numeric:lining-nums}
.ranked .t{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3;color:var(--ink)}
.ranked .why{grid-column:2;font-size:13px;color:var(--mute);line-height:1.55}

/* 业界 */
.industry{margin-top:48px}
.ind-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule-strong);margin-top:10px}
.ind-grid .item{padding:14px 22px 18px 0;border-bottom:1px solid var(--rule)}
.ind-grid .item:not(:nth-child(3n+1)){padding-left:22px;border-left:1px solid var(--rule)}
@media (max-width:900px){.ind-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ind-grid .item:not(:nth-child(3n+1)){padding-left:0;border-left:0}.ind-grid .item:nth-child(2n){padding-left:22px;border-left:1px solid var(--rule)}}
@media (max-width:640px){.ind-grid{grid-template-columns:minmax(0,1fr)}.ind-grid .item:nth-child(2n){padding-left:0;border-left:0}.ind-grid .item{padding-right:0}}
.item{display:grid;gap:6px;align-content:start}
.item .cat{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.item .t{font-family:var(--zh-display);font-weight:600;font-size:17px;line-height:1.4;color:var(--ink);text-decoration:none}
.item .orig{font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--faint)}
.item .sum{font-size:14px;line-height:1.6;color:var(--text)}
.ind-grid .item .sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.industry .deeps .item .sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .why{font-size:13px;line-height:1.55;color:var(--mute)}
.item .why::before{content:"";display:inline-block;width:14px;height:1px;background:var(--accent);vertical-align:4px;margin-right:8px}
.item .src{font-size:12px;color:var(--faint)}
.item .src a{color:var(--mute)}
.deeps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;margin-top:22px}
.deeps .item{border-top:2px solid var(--rule-strong);padding-top:12px}
.deeps .item .t{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3}
@media (max-width:900px){.deeps{grid-template-columns:minmax(0,1fr);gap:18px}}
.news-cat{margin-top:34px}
.news-list{display:grid;border-top:1px solid var(--rule-strong);margin-top:10px}
.news-list .item{grid-template-columns:minmax(0,1fr) 190px;gap:4px 28px;padding:16px 0;border-bottom:1px solid var(--rule)}
.news-list .item>.src{grid-column:2;grid-row:1 / span 4;text-align:right;word-break:keep-all;overflow-wrap:anywhere}
.news-list .item .t{font-size:18px}
@media (max-width:640px){.news-list .item{grid-template-columns:minmax(0,1fr)}.news-list .item>.src{grid-column:1;grid-row:auto;text-align:left}}
.health{margin-top:36px;font-size:12.5px;color:var(--faint);line-height:1.8}
.health b{color:var(--mute);font-weight:500}
.more{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font-size:13px}
.more:hover{text-decoration:underline;text-underline-offset:3px}

/* 论文库 */
.search{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--rule-strong);padding:4px 0}
.search svg{width:20px;height:20px;stroke:var(--ink);flex:none}
.search input{flex:1;border:0;background:none;font-family:var(--serif);font-size:clamp(18px,2vw,22px);color:var(--ink);padding:8px 0;outline:none;min-width:0}
.search input::placeholder{color:var(--faint)}
.filters{display:flex;gap:4px 18px;flex-wrap:wrap;margin:12px 0 4px;font-size:13.5px}
.filters button{border:0;background:none;padding:2px 0;cursor:pointer;color:var(--mute)}
.filters button[aria-pressed="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.archive{list-style:none;margin:8px 0 0;padding:0}
.archive .dh{padding:22px 0 6px;border-bottom:1px solid var(--rule-strong);display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:700;color:var(--ink)}
.archive .dh span{font-weight:400;color:var(--faint)}
.archive .row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"chk t sc" "chk why why";gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.archive .check{grid-area:chk;width:18px;height:18px;align-self:start;margin-top:2px}
.archive .t{grid-area:t;font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.3;color:var(--ink)}
.archive .score{grid-area:sc}
.archive .why{grid-area:why;font-size:13px;color:var(--mute);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.archive .row.read .t{color:var(--faint)}
@media (max-width:640px){.archive .row{gap:4px 12px}.archive .t{font-size:16px}}

/* 笔记 */
.letters{display:grid;gap:0;max-width:760px}
.letter{all:unset;cursor:pointer;display:grid;gap:6px;padding:18px 0;border-bottom:1px solid var(--rule)}
.letter:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.letter .t{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.3;color:var(--ink)}
.letter .n{font-size:14.5px;line-height:1.65;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* 设置 */
.form{display:grid;gap:20px;max-width:640px}
.form h2{margin:0;font-family:var(--zh-display);font-weight:900;font-size:24px;color:var(--ink)}
.form .section{display:grid;gap:18px;padding-top:14px;border-top:1px solid var(--rule-strong)}
label{font-size:13px;color:var(--mute);display:grid;gap:6px}
input[type=number],input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:0;padding:9px 12px;width:100%}
input[type=number]:focus,input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;line-height:1.75}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:560px){.three{grid-template-columns:1fr 1fr}}
.slider{display:grid;grid-template-columns:48px 1fr 44px;gap:14px;align-items:center;font-size:14px}
.slider label{display:block;color:var(--ink);font-size:14px}
.slider input{width:100%;accent-color:var(--accent)}
.slider output{text-align:right;font-family:var(--serif);font-size:16px;color:var(--ink)}
.status-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.status-list li::before{content:"";display:inline-block;width:8px;height:8px;margin-right:10px;vertical-align:1px;background:var(--rule)}
.status-list li.ok::before{background:var(--ink)}

.empty{border-top:2px solid var(--rule-strong);padding:20px 0;max-width:38em;display:grid;gap:8px;color:var(--mute)}
.empty strong{font-family:var(--zh-display);font-weight:900;font-size:24px;color:var(--ink)}
.empty.err strong{color:var(--accent)}

/* 论文详情：从右侧滑出的抽屉。背后的版面略微缩小、蒙一层虚化 */
.scrim{position:fixed;inset:0;z-index:29;background:color-mix(in srgb,var(--ink) 12%,transparent);-webkit-backdrop-filter:blur(2.5px) saturate(.9);backdrop-filter:blur(2.5px) saturate(.9);opacity:0;transition:opacity .45s ease}
.drawer-on .scrim{opacity:1}
#mast,#main{transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.drawer-on #mast,.drawer-on #main{transform:scale(.986)}
.reader{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(860px,100vw);background:var(--paper);overflow-y:auto;overscroll-behavior:contain;border-left:1px solid var(--rule);box-shadow:-30px 0 80px -40px rgba(0,0,0,.45);transform:translateX(104%);transition:transform .5s cubic-bezier(.2,.8,.2,1);scrollbar-gutter:stable}
.drawer-on .reader{transform:none}
.reader.closing{transform:translateX(104%);transition-duration:.3s;transition-timing-function:cubic-bezier(.5,0,.8,.3)}
.reader-bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.reader-bar .in{display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 44px}
.reader-bar .where{font-size:13px;color:var(--mute);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-bar .where b{color:var(--accent);font-weight:700;letter-spacing:.08em;margin-right:10px}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:100%;transform-origin:0 50%;transform:scaleX(0)}
.ibtn{border:1px solid var(--rule);background:var(--paper);width:34px;height:34px;cursor:pointer;color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center;transition:border-color .15s,background .15s}
.ibtn:hover:not(:disabled){border-color:var(--ink)}
.ibtn:disabled{opacity:.3;cursor:default}
@media (max-width:640px){.reader-bar .in{padding:0 12px 0 18px}}

.article{padding:30px 44px calc(env(safe-area-inset-bottom,0px) + 90px);display:grid;gap:24px}
.article>*{min-width:0}
@media (max-width:640px){.article{padding:24px 18px calc(env(safe-area-inset-bottom,0px) + 80px);gap:26px}}
.hd{display:grid;gap:12px}
.article h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(25px,3.1vw,33px);line-height:1.16;letter-spacing:-.014em;color:var(--ink);text-wrap:balance;font-variation-settings:"opsz" 60}
.article .zh-title{margin:0;font-family:var(--zh-display);font-weight:600;font-size:clamp(17px,1.8vw,19px);line-height:1.5;letter-spacing:0;color:var(--text)}
.article .authors{font-size:13.5px;color:var(--mute);line-height:1.65}
.article .tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.article .tools .ext{margin-left:auto;font-size:13px;color:var(--faint);display:inline-flex;gap:8px;align-items:center}
.article .tools .ext a{color:var(--mute);text-decoration:none}
.article .tools .ext a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.article .tools .ext i{font-style:normal;color:var(--rule)}
@media (max-width:640px){.article .tools .ext{margin-left:0;width:100%}}

/* 一句话结论：版面上最显眼的一句 */
.tldr{margin:0;font-family:var(--zh-display);font-weight:600;font-size:clamp(17px,1.9vw,19px);line-height:1.65;letter-spacing:0;color:var(--ink);text-wrap:pretty}
.tldr::before{content:"";display:block;width:32px;height:3px;background:var(--accent);margin-bottom:12px}
.lbl{display:block;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:8px}
.article h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent)}

/* 正文：中文衬线，行距放宽，段落之间留白，宽度控制在每行 38 字左右 */
.prose{max-width:40em}
.prose p{margin:0 0 .75em;font-family:var(--serif);font-size:15.5px;line-height:1.8;letter-spacing:0;color:var(--text);hanging-punctuation:allow-end;text-wrap:pretty}
.prose p:last-child{margin-bottom:0}
@media (max-width:640px){.prose p{font-size:15.5px;line-height:1.78}}
.sec{display:grid;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:14px;border-top:1px solid var(--rule-strong);padding-top:12px}
.sec-h .no{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:lining-nums;letter-spacing:.04em}
.article .sec-h h2{font-family:var(--zh-display);font-weight:900;font-size:19px;letter-spacing:.04em;color:var(--ink)}
.sec-h small{margin-left:auto;font-size:12px;color:var(--faint)}
/* 评论：和论文自述分开，换底色 */
.sec.take{background:var(--paper-2);padding:4px 24px 22px;margin:0 -24px}
.sec.take .sec-h{border-top-color:var(--accent)}
@media (max-width:640px){.sec.take{padding:4px 18px 20px;margin:0 -18px}}
.asks{list-style:none;margin:0;padding:0;counter-reset:q;display:grid;gap:8px;max-width:40em}
.asks li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;font-family:var(--serif);font-size:15.5px;line-height:1.7;color:var(--ink)}
.asks li::before{content:"Q" counter(q);font-family:var(--serif);font-size:13px;font-weight:600;color:var(--accent);padding-top:3px}
.why-box{display:grid;gap:8px;max-width:40em}
.why-box p{font-family:var(--serif);font-size:15px;line-height:1.75;color:var(--text)}
.why-box b{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);margin-right:10px}

/* 摘要：中文 / 英文切换 */
.abs-h{display:flex;align-items:center;gap:14px}
.abs-h .seg button{padding:2px 12px;font-size:12.5px}
.abs{font-family:var(--serif);font-size:15px;line-height:1.8;color:var(--text);max-width:40em}
.abs.en{font-size:15.5px;line-height:1.65}

/* 图表 */
.fig{margin:4px 0;display:grid;gap:12px}
.fig .img{all:unset;cursor:zoom-in;display:block;background:#fff;border:1px solid var(--rule);overflow:hidden;position:relative}
.fig .img:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fig img{display:block;width:100%;height:auto;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.fig .img:hover img{transform:scale(1.02)}
.fig .img+.img{margin-top:8px}
.fig figcaption{display:grid;gap:4px;max-width:40em}
.fig .note{font-family:var(--serif);font-size:14.5px;line-height:1.7;color:var(--text)}
.fig .note b{font-family:var(--serif);font-weight:600;color:var(--ink);margin-right:8px}
.fig .orig{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.6;color:var(--faint)}
.ftable{overflow-x:auto;border-top:2px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong)}
.ftable table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums lining-nums}
.ftable td{padding:6px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;color:var(--text)}
.ftable tr:first-child td{font-weight:700;color:var(--ink);border-bottom-color:var(--rule-strong)}
.ftable tr:last-child td{border-bottom:0}
.src-note{font-size:12.5px;color:var(--faint);line-height:1.7}
.src-note a{color:var(--mute)}

/* 解读还在路上时的占位 */
.skel{display:grid;gap:12px}
.skel i{display:block;height:14px;background:linear-gradient(90deg,var(--paper-2) 0%,var(--rule) 50%,var(--paper-2) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skel i:nth-child(3n){width:72%}
@keyframes shimmer{to{background-position:-200% 0}}

.lede{font-family:var(--serif);font-size:18px;line-height:1.85;color:var(--text)}
.related{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.related li{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink);padding-left:16px;position:relative}
.related li::before{content:"";position:absolute;left:0;top:.75em;width:8px;height:1px;background:var(--accent)}
.figure{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;font-size:13px;color:var(--mute)}
.figure b{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);margin-right:4px;font-variant-numeric:lining-nums}
details summary{cursor:pointer;font-size:13.5px;color:var(--mute);list-style:none}
details summary::before{content:"+";display:inline-block;width:16px;color:var(--accent);font-weight:700}
details[open] summary::before{content:"−"}
details[open] summary{margin-bottom:10px}
.notebox{display:grid;gap:12px;padding:22px;background:var(--paper-2)}
.notebox textarea{font-family:var(--serif);font-size:16.5px;line-height:1.85;background:var(--paper);border-color:var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);justify-self:start}
.seg button{border:0;background:none;padding:5px 14px;cursor:pointer;font-size:13.5px;color:var(--ink);transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{border:1px solid var(--rule);background:var(--paper);padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--mute)}
.flag[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.saved{font-size:12.5px;color:var(--faint)}
.ai{display:grid;gap:12px;border-top:1px solid var(--rule-strong);padding-top:18px}
.ai-out{white-space:pre-wrap;font-family:var(--serif);font-size:16.5px;line-height:1.9;color:var(--text);border-left:3px solid var(--ink);padding:4px 0 4px 18px}
.next{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-top:2px solid var(--rule-strong);padding-top:16px}
.next button{all:unset;cursor:pointer;display:grid;gap:4px}
.next button:last-child{text-align:right}
.next small{font-size:12px;color:var(--mute);letter-spacing:.06em}
.next span{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.35;color:var(--ink)}
.next button:hover span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.next button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@media (max-width:640px){.next{grid-template-columns:1fr}.next button:last-child{text-align:left}}

/* 看大图 */
.zoom{position:fixed;inset:0;z-index:50;display:grid;place-items:center;gap:12px;padding:24px;background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:zoom-out;opacity:0;transition:opacity .3s ease}
.zoom.on{opacity:1}
.zoom img{max-width:min(1400px,94vw);max-height:84vh;background:#fff;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);transform:scale(.92);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.zoom.on img{transform:none}
.zoom p{max-width:60em;font-size:13.5px;line-height:1.6;color:var(--mute);text-align:center}

.colophon{border-top:1px solid var(--rule-strong);margin-top:56px;padding-top:12px;display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.colophon .keys{white-space:nowrap}
@media (max-width:640px),(hover:none){.colophon .keys{display:none}}
.colophon kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--rule);padding:0 4px;margin:0 2px;color:var(--mute)}

.jobbar{display:flex;align-items:center;gap:10px;margin:14px auto 0;padding:9px 14px;border:1px solid var(--rule);font-family:var(--sans);font-size:13.5px;color:var(--text);background:var(--paper-2)}
.jobbar[hidden]{display:none}
.hintbar{justify-content:space-between;flex-wrap:wrap;row-gap:6px}.hintbar .acts{display:flex;gap:8px;align-items:center}.optrow{display:flex!important;gap:8px;align-items:flex-start;font-size:14px}.optrow input{width:auto;margin-top:4px}
.setup{max-width:760px;margin:28px auto 40px}
.setup h1{font-family:var(--serif);font-size:30px;margin:0 0 6px}
.setup .lede{color:var(--mute);margin:0 0 22px}
.step{border-top:1px solid var(--rule);padding:18px 0 20px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 14px}
.step .n{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600}
.step.ok .n{background:var(--ink);color:var(--paper)}
.step.off{opacity:.45}
.step h2{font-family:var(--sans);font-size:17px;margin:2px 0 8px}
.step ul.checks{list-style:none;padding:0;margin:0 0 10px;font-size:14.5px;line-height:1.9}
.step ul.checks li::before{content:"○ ";color:var(--faint)}
.step ul.checks li.ok::before{content:"✓ ";color:var(--ink);font-weight:700}
.step .help{font-size:14px;color:var(--text);background:var(--paper-2);padding:10px 14px;margin:6px 0 10px;line-height:1.7}
.step label{display:block;margin:10px 0 4px;font-size:14px}
.step select{font:inherit;padding:8px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);width:100%}
.step .err{color:#b3261e;font-size:14px;margin:8px 0 0}
.updnotes{white-space:pre-wrap;margin:6px 0 0;color:var(--mute);font-size:13px;max-height:9em;overflow:auto}
.hintbar kbd{font-family:var(--sans);font-size:12px;border:1px solid var(--rule);padding:0 5px}
.jobbar .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:jobpulse 1.2s ease-in-out infinite}
@keyframes jobpulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.jobbar .dot{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}

/* ===================== 大报版式 =====================
   版面逻辑参照大报网站首页：三行报头 + 双细线；主栏和右栏约 2:1，用浅灰竖线分开；
   主栏顶部是黑细线框住的头条包；栏目以“通栏黑细线 + 粗体无衬线栏目名”开头；
   标题衬线粗体，摘要衬线灰色，元信息用字距拉开的小号大写无衬线。几乎只用黑白灰。
   字体用开源替代：标题和正文 Newsreader / 思源宋体，界面文字 Libre Franklin。 */
:root{--franklin:"Libre Franklin","Noto Sans SC","PingFang SC",system-ui,sans-serif;--blue:#326891;--btn:#567B95;--summ:#5A5A5A;--meta:#727272;--hair:#DFDFDF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blue:#8DB5D6;--btn:#4A6A82;--summ:#ABABAB;--meta:#8C8C8C;--hair:#333333}}
:root[data-theme="dark"]{--blue:#8DB5D6;--btn:#4A6A82;--summ:#ABABAB;--meta:#8C8C8C;--hair:#333333}
body{font-family:var(--franklin)}

/* 报头 */
.m1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:10px;min-height:46px}
.msearch{justify-self:start;border:0;background:none;width:32px;height:32px;margin-left:-6px;padding:6px;cursor:pointer;color:var(--ink)}
.msearch svg{width:18px;height:18px;display:block}
.med{display:flex;gap:20px;font-family:var(--franklin);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.med span:first-child{font-weight:700;color:var(--ink)}
.m1r{justify-self:end;display:flex;align-items:center;gap:18px}
.sub-btn{border:0;border-radius:3px;background:var(--btn);color:#fff;font-family:var(--franklin);font-size:11px;font-weight:700;letter-spacing:.06em;padding:9px 14px;cursor:pointer}
.sub-btn:hover{filter:brightness(.9)}
.acct{border:0;background:none;padding:4px 0;font-family:var(--franklin);font-size:14px;color:var(--ink);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.m2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:4px;padding-bottom:12px}
.m2 h1{margin:0;font-family:var(--masthead);font-weight:400;font-size:clamp(40px,5.2vw,70px);line-height:1.05;letter-spacing:0;padding-left:0;white-space:nowrap;color:var(--ink);text-align:center;transform-origin:50% 60%}
.m2l{display:grid;gap:6px;justify-items:start;font-family:var(--franklin);font-size:14px;color:var(--ink)}
.m2l b{font-weight:500}
.mlink{border:0;background:none;padding:0;font-family:var(--franklin);font-size:13.5px;color:var(--ink);cursor:pointer}
.mlink:hover,.acct:hover{text-decoration:underline;text-underline-offset:3px}
.m2r{justify-self:end;display:grid;gap:6px;justify-items:end;font-family:var(--franklin);font-size:14px;color:var(--ink)}
.m2r b{font-weight:500;margin-left:6px}
.mnav{justify-content:center;gap:6px;margin:0}
.mnav button,.slim .nav button{font-family:var(--franklin);font-size:15px;color:var(--ink);padding:10px 18px}
.mnav button[aria-current="page"],.slim .nav button[aria-current="page"]{font-weight:700}
.mnav button::after,.slim .nav button::after{display:none!important}
.mnav button:hover{text-decoration:underline;text-underline-offset:4px}
.rules{height:5px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
body:not(.tab-today) .m2{padding-bottom:6px}
body:not(.tab-today) .m2 h1{font-size:clamp(34px,3.4vw,46px)}
@media (max-width:820px){.m2 h1{font-size:clamp(30px,9vw,44px)}.med,.m2l,.m2r,.acct{display:none}.m1{grid-template-columns:auto 1fr auto}.m2{grid-template-columns:1fr}.mnav{justify-content:flex-start;overflow-x:auto;margin:0 -16px;padding:0 6px}.mnav button{padding:10px 12px;font-size:14px}}
.slim .wrap{height:46px}

/* 今日：主栏 + 右栏 */
main{padding-top:16px}
.front2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
.fmain{padding-right:20px;border-right:1px solid var(--hair);min-width:0}
.frail{padding-left:20px;min-width:0}
@media (max-width:1000px){.front2{grid-template-columns:minmax(0,1fr)}.fmain{padding-right:0;border-right:0}.frail{padding-left:0;margin-top:30px}}

/* 头条包 */
.pkg{border:1px solid var(--ink);padding:0 20px 20px}
.pkg-h{margin:0;text-align:center;padding:18px 0 20px;font-family:var(--franklin);font-size:17px;color:var(--ink)}
.pkg-h span{display:inline-block;padding-bottom:12px;background:linear-gradient(var(--blue),var(--blue)) center bottom/78px 2px no-repeat}
.pl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:0 24px}
.pl-side{display:grid;gap:4px;align-content:start}
.pl.noimg{grid-template-columns:minmax(0,1fr)}
.pl-text{display:grid;gap:8px;align-content:start}
.hl{margin:0;font-family:var(--serif);font-weight:700;font-size:27px;line-height:1.15;letter-spacing:-.006em;color:var(--ink);text-decoration:none}
.pl .zh-sub{font-size:16px;color:var(--text);margin:0}
.psum{font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--summ)}
.mline{margin:0;font-family:var(--franklin);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--meta);display:flex;flex-wrap:wrap;gap:0 7px;line-height:1.6}
.mline i{font-style:normal;color:var(--hair)}
.stamps{margin:0}
.stamps .stamp{margin-left:0;margin-right:6px}
.rel{list-style:none;margin:6px 0 0;padding:0}
.rel li{border-top:1px solid var(--hair);padding:12px 0 4px;font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--text)}
.rel b{display:block;font-family:var(--franklin);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink);margin-bottom:3px}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.acts .btn{font-family:var(--franklin);font-size:12.5px;padding:5px 12px}
.pl-fig{margin:0}
.pimg{all:unset;cursor:pointer;display:block;background:#fff}
.pimg img{display:block;width:100%;height:auto;max-height:430px;object-fit:contain}
.credit{display:block;text-align:right;font-family:var(--franklin);font-size:11px;color:var(--meta);margin-top:6px}
@media (max-width:700px){.pl{grid-template-columns:minmax(0,1fr)}.pl-side{display:contents}.pl-fig{order:-1;margin-bottom:12px}.pl-side .rel{order:1}.pkg{padding:0 14px 14px}}

/* 两列小条目，右边方形缩略图 */
.pkg-more{margin-top:22px;border-top:1px solid var(--ink);padding-top:12px}
.fsect .pkg-more{margin-top:0}
.fsect{margin-top:26px}
.lbl{margin:0 0 4px;font-family:var(--franklin);font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.lbl span{font-weight:400;font-size:12px;color:var(--meta)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.pi{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:16px;padding:16px 0;border-bottom:1px solid var(--hair);align-items:start}
.pi:not(:has(.pthumb)){grid-template-columns:minmax(0,1fr)}
.pgrid .pi:nth-child(odd){padding-right:20px;border-right:1px solid var(--hair)}
.pgrid .pi:nth-child(even){padding-left:20px}
.pgrid .pi:last-child,.pgrid .pi:nth-last-child(2):nth-child(odd){border-bottom:0}
.ht{margin:0;font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.25;color:var(--ink);text-decoration:none;display:block}
.pi .zh-sub{font-size:14px;margin-top:3px}
.isum{margin-top:6px;font-family:var(--serif);font-size:14.5px;line-height:1.45;color:var(--summ);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pi-foot{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:9px}
.pi-foot .check{width:15px;height:15px;margin:0}
.pi-foot .stamp{margin-left:0}
.pthumb{all:unset;cursor:pointer;display:block;width:100px;height:100px;background:#fff;overflow:hidden;outline:1px solid var(--hair);outline-offset:-1px}
.pthumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.pi.read .ht{color:var(--meta)}
@media (max-width:700px){.pgrid{grid-template-columns:minmax(0,1fr)}.pgrid .pi:nth-child(n){padding-left:0;padding-right:0;border-right:0;border-bottom:1px solid var(--hair)}.pgrid .pi:last-child{border-bottom:0}.pi{grid-template-columns:minmax(0,1fr) 84px}.pthumb{width:84px;height:84px}}

/* 右栏 */
.feature{display:grid;gap:10px;padding-bottom:20px}
.pager-s{margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--franklin);font-size:12px;color:var(--meta)}
.pager-s button{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);cursor:pointer;font-size:16px;line-height:1;color:var(--ink);flex:none}
.pager-s button:hover:not(:disabled){border-color:var(--ink)}
.pager-s button:disabled{opacity:.35;cursor:default}
.fh{margin:0;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.22;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.fsum{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--summ)}
.rsect{border-top:1px solid var(--ink);padding-top:12px;margin-top:4px;margin-bottom:22px}
.plan-rail{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.plan-rail .bar{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:center;width:100%;font-family:var(--franklin);font-size:12.5px;color:var(--ink)}
.plan-rail .cells{height:8px}
.plan-rail .pm{text-align:right;color:var(--meta)}
.plan-rail .bar:hover .pn{text-decoration:underline;text-underline-offset:3px}
.rlist{list-style:none;margin:0;padding:0}
.rlist .brief{display:block;padding:14px 0;border-bottom:1px solid var(--hair)}
.rlist .brief:last-child{border-bottom:0}
.rlist .brief .n{display:none}
.rlist .brief .t{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.25}
.rlist .brief .why{font-family:var(--serif);font-size:14px;line-height:1.45;color:var(--summ)}
.tk{margin:0 0 5px;font-family:var(--franklin);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}

/* 业界：一条大新闻 + 大图 + 右侧带缩略图的列表，下面一行三条，再下面深度文章卡片 */
.sect{margin-top:40px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--ink);padding-top:12px;margin-bottom:14px}
.sect-h h2{margin:0;font-family:var(--franklin);font-size:16px;font-weight:700;color:var(--ink)}
.sect-h.sub{margin-top:30px}
.fmain .sect{margin-top:30px}
.fmain .mn{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.fmain .mn.noimg{grid-template-columns:minmax(0,1fr)}
.fmain .mn-side{grid-column:1/-1;border-left:0;padding-left:0;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.fmain .mn-side .si{margin:0;padding:0 16px;border-bottom:0;border-left:1px solid var(--hair);grid-template-columns:minmax(0,1fr)}
.fmain .mn-side .si:first-child{padding-left:0;border-left:0}
.fmain .mn-side .nthumb{display:none}
@media (max-width:700px){.fmain .mn-side{grid-template-columns:minmax(0,1fr)}.fmain .mn-side .si{padding:12px 0;border-left:0;border-bottom:1px solid var(--hair)}}
.sect .more{font-family:var(--franklin);color:var(--ink);font-size:13px}
.mn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.75fr) minmax(0,1.05fr);gap:0 20px;padding-bottom:18px;border-bottom:1px solid var(--hair)}
.mn.noimg{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.mn-lead{display:grid;gap:8px;align-content:start}
.mn-lead .hl{font-size:24px;line-height:1.25}
.mn-fig{margin:0}
.mn-fig img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--paper-2)}
.mn-side{border-left:1px solid var(--hair);padding-left:20px}
.si{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--hair)}
.si:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.si:not(:has(.nthumb)){grid-template-columns:minmax(0,1fr)}
.si .ht,.row3 .ht,.card .ht{font-size:16px;line-height:1.3}
.nthumb{display:block;width:96px;height:96px;overflow:hidden;background:var(--paper-2)}
.nthumb img,.cimg img{display:block;width:100%;height:100%;object-fit:cover}
.si .mline,.row3 .mline,.mn-lead .mline{margin-top:6px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:16px 0;border-bottom:1px solid var(--hair)}
.row3>*{padding:0 20px;border-left:1px solid var(--hair)}
.row3>*:first-child{padding-left:0;border-left:0}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.card{padding:0 14px;border-left:1px solid var(--hair);display:grid;gap:6px;align-content:start}
.card:first-child{padding-left:0;border-left:0}
.cimg{display:block;aspect-ratio:3/2;overflow:hidden;background:var(--paper-2);margin-bottom:4px}
.card .isum{-webkit-line-clamp:4}
a.ht,a.hl{color:var(--ink)}
@media (max-width:1000px){.mn{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mn-side{grid-column:1/-1;border-left:0;padding-left:0;margin-top:18px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.card:nth-child(4){padding-left:0;border-left:0}}
@media (max-width:700px){.mn,.mn.noimg{grid-template-columns:minmax(0,1fr)}.mn-fig{order:-1;margin-bottom:12px}.row3,.cards{grid-template-columns:minmax(0,1fr)}.row3>*,.card{padding:12px 0!important;border-left:0!important;border-bottom:1px solid var(--hair)}.row3>*:last-child,.card:last-child{border-bottom:0}}


/* 栏目页的版头：大标题 + 灰色导语 + 翻页 */
.secfront{display:grid;gap:10px;padding:10px 0 22px;border-bottom:1px solid var(--hair);margin-bottom:22px}
.sec-title{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(34px,4vw,46px);line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
.sec-title.wk{font-size:clamp(28px,3.2vw,38px);line-height:1.2;max-width:22em;text-wrap:balance}
.sec-dek{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--summ);max-width:44em}
.pager-s.wide{justify-content:flex-start;gap:14px}
.sect-h .cnt{font-family:var(--franklin);font-size:12px;color:var(--meta)}
.fmain>.sect:first-child{margin-top:0}

/* 业界页的条目：标题、原题、摘要、理由、来源，右边配图 */
.nr{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;padding:16px 0;border-bottom:1px solid var(--hair)}
.nr:last-child{border-bottom:0}
.nr:not(:has(.nimg)){grid-template-columns:minmax(0,1fr)}
.nr-text{display:grid;gap:6px;align-content:start}
.nr .ht{font-size:20px;line-height:1.3}
.orig2{margin:0;font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.4;color:var(--meta)}
.nwhy{margin:0;font-family:var(--franklin);font-size:13px;line-height:1.55;color:var(--text)}
.nwhy::before{content:"为什么值得看　";font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--ink)}
.nr .mline a{color:var(--meta)}
.nimg{display:block;aspect-ratio:3/2;overflow:hidden;background:var(--paper-2)}
.nimg img{display:block;width:100%;height:100%;object-fit:cover}
.dr{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--hair)}
.dr:last-child{border-bottom:0}
.dr .cimg{margin-bottom:6px}
@media (max-width:700px){.nr{grid-template-columns:minmax(0,1fr) 96px;gap:14px}.nr .ht{font-size:17.5px}}

/* 本周 */
.themes2{border-bottom:0}
.themes2 .ht{font-size:20px;margin-bottom:6px}
.themes2 .psum{font-size:15px}
.refs2{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.refs2 li{padding-left:14px;position:relative;font-family:var(--serif);font-size:14.5px;line-height:1.4;color:var(--ink)}
.refs2 li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:1px;background:var(--ink)}
table.plan{font-family:var(--franklin)}
.plan th{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink);border-bottom:1px solid var(--ink)}
.plan td{border-bottom:1px solid var(--hair)}
.plan td.k.deep{color:var(--ink)}
.plan .hit{font-family:var(--serif);font-weight:700;font-size:15.5px}
.ranked li{grid-template-columns:40px minmax(0,1fr) auto;border-bottom:1px solid var(--hair);padding:16px 0}
.ranked li::before{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--hair);line-height:1}
.ranked .t{font-weight:700;font-size:18px}
.ranked .why{font-family:var(--serif);font-size:14.5px;color:var(--summ)}

/* 论文库、笔记、设置 */
.search{border-bottom:1px solid var(--ink)}
.search input{font-weight:400}
.filters{font-family:var(--franklin)}
.filters button[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--ink)}
.archive .dh{font-family:var(--franklin);font-size:13px;letter-spacing:.02em}
.archive .t{font-weight:700;font-size:17px}
.archive .why{font-family:var(--serif);font-size:14.5px;color:var(--summ)}
.letter{border-bottom:1px solid var(--hair)}
.letter .kicker{font-family:var(--franklin);font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--text)}
.letter .t{font-weight:700;font-size:20px}
.letter .n{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--summ)}
.form{font-family:var(--franklin)}
.form .section{border-top:1px solid var(--ink)}
.form h2{font-family:var(--franklin);font-weight:700;font-size:16px}
.colophon{font-family:var(--franklin);border-top:1px solid var(--ink)}
.kicker{font-family:var(--franklin)}
.section-h{border-top:1px solid var(--ink)}
.section-h h2{font-family:var(--franklin);font-weight:700;font-size:16px}


/* ===================== 排版系统（统一字号、颜色、字重、间距） =====================
   字号七档：版头 40 / 头条 30 / 导读 28 / 条目标题 19 / 小标题 16.5 / 正文 16·15 / 标签 12
   颜色四档：标题 --c-head / 正文 --c-body / 次要 --c-sec / 元信息 --c-meta
   间距按 8 的倍数：栏目之间 48，模块之间 28，条目上下 16–20，标题到摘要 6
   中文小字不用细宋体配浅灰：摘要用深一点的灰，中文副标题用黑体。 */
:root{--c-head:#121212;--c-body:#333333;--c-sec:#555555;--c-meta:#6E6E6E;--zh-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-head:#F2F2F2;--c-body:#D2D2D2;--c-sec:#ADADAD;--c-meta:#8F8F8F}}
:root[data-theme="dark"]{--c-head:#F2F2F2;--c-body:#D2D2D2;--c-sec:#ADADAD;--c-meta:#8F8F8F}

/* 标题：全部衬线粗体，只用四档 */
.hl{font-size:30px;line-height:1.2;font-weight:700;color:var(--c-head)}
.mn-lead .hl{font-size:26px;line-height:1.25}
.ht,.nr .ht,.pi .ht,.themes2 .ht{font-size:19px;line-height:1.3;font-weight:700;color:var(--c-head)}
.pi .ht{font-size:17.5px;line-height:1.3}
.pl .hl{font-size:28px}
.rlist .brief .t,.si .ht,.row3 .ht,.card .ht,.dr .ht{font-size:16.5px;line-height:1.35;font-weight:700;color:var(--c-head)}
.fh{font-size:28px;line-height:1.3;font-weight:400;color:var(--c-head)}
.sec-title{font-size:40px;line-height:1.15}
.sec-title.wk{font-size:34px;line-height:1.25}

/* 中文副标题：黑体，和英文衬线标题分开 */
.zh-sub{font-family:var(--zh-sans);font-size:14.5px;line-height:1.5;color:var(--c-sec);margin-top:4px}
.pl .zh-sub{font-size:16px;color:var(--c-body);margin:0}

/* 正文和摘要：头条 17、条目 16、卡片 15；颜色比以前深 */
.psum{font-size:16px;line-height:1.65;color:var(--c-body);max-width:40em}
.pl .psum{font-size:17px;line-height:1.65}
.fsum,.sec-dek{font-size:16px;line-height:1.65;color:var(--c-body)}
.isum,.rlist .brief .why,.archive .why,.letter .n,.ranked .why,.themes2 .psum{font-size:15px;line-height:1.6;color:var(--c-sec)}
.rel li{font-size:15px;line-height:1.6;color:var(--c-body)}
.nwhy{font-size:14px;line-height:1.6;color:var(--c-sec)}
.orig2{font-size:14px;color:var(--c-meta)}

/* 标签和元信息：无衬线 12px，字距收紧（中文不适合大字距） */
.mline{font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--c-meta);line-height:1.5}
.tk{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--c-head);margin-bottom:6px}
.rel b,.nwhy::before{font-size:12px;letter-spacing:.02em}
.credit{font-size:12px;color:var(--c-meta)}

/* 栏目分隔：大栏目 2px 黑线 + 18px 栏目名；栏目里的模块 1px 线 + 14px 名称 */
.sect{margin-top:48px}
.fmain .sect{margin-top:40px}
.fmain>.sect:first-child{margin-top:0}
.sect-h{border-top:2px solid var(--ink);padding-top:12px;margin-bottom:8px}
.sect-h h2{font-size:18px;font-weight:700;letter-spacing:.01em}
.lbl{font-size:14px;letter-spacing:.02em;margin-bottom:4px}
.lbl span{font-size:12px}
.pkg-more{margin-top:28px;padding-top:14px}
.rsect{margin-top:8px;margin-bottom:28px;padding-top:14px}
.frail>.rsect:first-child{margin-top:0;border-top-width:2px;padding-top:12px}
.frail>.rsect:first-child .lbl{font-size:18px}

/* 条目间距 */
.pi{padding:18px 0}
.pi .zh-sub{margin-top:4px}
.isum{margin-top:6px}
.pi-foot{margin-top:10px}
.nr{padding:20px 0}
.nr-text{gap:6px}
.rlist .brief{padding:16px 0}
.si{padding-bottom:16px;margin-bottom:16px}
.dr{padding:16px 0}
.feature{gap:12px;padding-bottom:24px}
.pl-text{gap:10px}
.rel li{padding:14px 0 6px}

/* 天气 */
.wx{display:inline-flex;align-items:center;gap:6px;font-family:var(--franklin);font-size:14px;color:var(--ink);white-space:nowrap}
.wx{border:0;background:none;padding:4px 6px;margin:-4px -6px;cursor:pointer;border-radius:3px}
.wx:hover{background:var(--paper-2)}
.wxpop{position:absolute;z-index:45;width:min(320px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--ink);box-shadow:0 12px 32px -12px rgba(0,0,0,.25);padding:14px;display:grid;gap:10px;font-family:var(--franklin)}
.wxpop .lbl{margin:0}
.wxpop input{font-family:var(--franklin);font-size:14px;padding:8px 10px;border:1px solid var(--hair)}
.wxpop input:focus{border-color:var(--ink)}
.wxpop ul{list-style:none;margin:0;padding:0;display:grid}
.wxpop li.mute{font-size:13px;padding:6px 2px}
.wxpop li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:baseline;gap:8px;width:100%;padding:8px 6px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink)}
.wxpop li:first-child button{border-top:0}
.wxpop li button:hover,.wxpop li button:focus-visible{background:var(--paper-2)}
.wxpop li span{font-size:12px;color:var(--c-meta)}
.wxpop-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--c-meta)}
.wxpop-foot .mlink{font-size:12px}
.wx b{font-weight:500}
.wx small{font-size:12px;color:var(--c-meta)}
@media (prefers-reduced-motion:no-preference){.wx-moon{transform-origin:12px 12px;animation:wx-glow 5s ease-in-out infinite}@keyframes wx-glow{50%{transform:rotate(-8deg)}}}
.wx-ic{width:22px;height:22px;flex:none;overflow:visible}
.m2r .tick b{margin-left:4px}
@media (prefers-reduced-motion:no-preference){
  .wx-rays{transform-origin:12px 12px;animation:wx-spin 24s linear infinite}
  .wx-partly .wx-rays{transform-origin:9px 9px}
  .wx-cloud{animation:wx-drift 6s ease-in-out infinite}
  .wx-drop{animation:wx-fall 1.4s linear infinite}
  .wx-flake{animation:wx-fall 2.6s linear infinite}
  .wx-drop.d2,.wx-flake.d2{animation-delay:-.5s}
  .wx-drop.d3,.wx-flake.d3{animation-delay:-1s}
  .wx-fog{animation:wx-slide 5s ease-in-out infinite}
  .wx-fog.d2{animation-delay:-2.5s}
  .wx-bolt{animation:wx-flash 3.2s steps(1) infinite}
  @keyframes wx-spin{to{transform:rotate(360deg)}}
  @keyframes wx-drift{50%{transform:translateX(1.2px)}}
  @keyframes wx-fall{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(4px);opacity:0}}
  @keyframes wx-slide{50%{transform:translateX(2px)}}
  @keyframes wx-flash{0%,70%,100%{opacity:1}72%,76%{opacity:.15}}
}
.wx-m{display:none}
@media (max-width:820px){.wx-m{display:inline-flex}.wx-m .wx span{display:none}}

/* 动效：第一次打开时报头双线展开；详情抽屉从右侧滑入，换篇时淡入。滚动时内容不做任何动画 */
@media (prefers-reduced-motion:no-preference){
  .intro .rules{animation:draw .9s cubic-bezier(.2,.7,.2,1) both}
  .intro .banner,.intro .dek{animation:rise .7s .25s cubic-bezier(.2,.7,.2,1) both}
  .intro .dek{animation-delay:.38s}
  @keyframes draw{from{transform:scaleX(0)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
      .article.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes swap{from{opacity:0;transform:translateX(calc(var(--dir,1) * 16px))}}
  .mast-title h1{will-change:transform,opacity}
}
@media (prefers-reduced-motion:reduce){.ul,.slim,.cells i,.check,.reader,.scrim,#mast,#main{transition:none}}
</style>
</head>
<body>
<div class="slim" id="slim" inert><div class="wrap"><b class="site-name">The Robot Times</b><nav class="nav" aria-label="页面"></nav></div></div>

<header class="mast" id="mast">
  <div class="wrap m1">
    <button class="msearch" data-tab="lib" aria-label="搜索论文库" title="搜索论文库"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg></button>
    <span class="med" id="edition"></span>
    <span class="m1r" id="m1r"></span>
  </div>
  <div class="wrap m2"><div class="m2l" id="dateline"></div><h1 class="site-name">The Robot Times</h1><div class="m2r" id="mastsub"></div></div>
  <div class="wrap"><nav class="nav mnav" aria-label="页面"></nav></div>
  <div class="wrap"><div class="rules"></div></div>
</header>

<div class="wrap"><div class="jobbar" id="jobbar" role="status" hidden></div><div class="jobbar hintbar" id="hintbar" hidden></div><div class="jobbar hintbar" id="updbar" role="status" hidden></div></div>
<main class="wrap" id="main"><p class="mute">正在载入…</p></main>

<div id="reader-root"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
const MODES = {
  deep:{name:"精读", short:"精读", order:0}, note:{name:"写笔记", short:"笔记", order:1}, review:{name:"接着读", short:"接读", order:2},
  abstract:{name:"看摘要", short:"摘要", order:3}, scan:{name:"扫标题", short:"扫读", order:4},
};
const TABS = [["today","今日"],["news","业界"],["week","本周"],["lib","论文库"],["notes","笔记"],["cfg","设置"]];
// 快讯类别的排列顺序；方向预设可能有别的类别，没列到的排在后面
const NEWS_CATS = ["具身智能","机器人产业","AI 模型与产品","AI 产业与资本","政策与安全","研究"];
const TIER_MODE = {deep:"deep", abstract:"abstract", scan:"scan"};
const STATUS = [["todo","待读"],["reading","在读"],["done","已读"],["skip","跳过"]];
const FLAGS = ["可 build on","方法可借鉴","反例/局限","要复现","组会分享"];
const DEFAULT_W = {relevance:0.5, impact:0.3, buzz:0.2};
const WEEKDAY = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const CHECK_SVG = `<svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="square"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>`;

const S = {ready:false, error:null, me:"", settings:null, features:{},
  papers:{}, days:[], weeks:[], notes:{}, zotero:{}, feedback:{},
  tab:(location.hash.slice(1)||"today"), dayIdx:0, weekIdx:0, open:null, order:[],
  lib:{q:"", status:"", list:null, total:0, loading:false}, wDraft:null, introDone:false,
  news:null, newsDates:[], newsIdx:0, newsCache:{}};
if(!TABS.some(([k])=>k===S.tab)) S.tab="today";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { if(!d) return ""; const [, m, dd] = d.slice(0,10).split("-"); return `${+m}月${+dd}日`; };
const longDate = d => { const x=new Date(d.slice(0,10)+"T00:00:00"); return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日　${WEEKDAY[x.getDay()]}`; };
const venueText = v => String(v||"").replace(/\s*·\s*/g," ");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }

async function api(path, opts={}){
  let resp;
  try{ resp = await fetch(path, {...opts, headers:{"content-type":"application/json", ...(opts.headers||{})}, credentials:"same-origin"}); }
  catch(e){ throw new Error("连不上服务器，或者登录过期了，请刷新页面。"); }
  if(resp.status===401 || (resp.redirected && !resp.url.includes("/api/"))) throw new Error("登录已过期，请刷新页面。");
  const ct = resp.headers.get("content-type")||"";
  if(!ct.includes("application/json")){ if(!resp.ok) throw new Error(`请求失败：HTTP ${resp.status}`); return resp; }
  const data = await resp.json();
  if(!resp.ok) throw new Error(data.error || `请求失败：HTTP ${resp.status}`);
  return data;
}

/* 综合分：和 core/ 的 total_score 一致。有 LLM 分时相关度 = 0.3·向量 + 0.7·LLM；缺失的分项不参与，权重重新归一 */
function weights(){ return S.wDraft || S.settings?.weights || DEFAULT_W; }
function relOf(s){ return s.llm==null ? s.rel : 0.3*(s.rel||0)+0.7*s.llm; }
function total(p){
  const w=weights(), s=p.scores||{};
  const parts=[[relOf(s),w.relevance],[s.impact,w.impact],[s.buzz,w.buzz]].filter(([v,wt])=>v!=null&&wt>0);
  const sum=parts.reduce((a,[,wt])=>a+wt,0);
  return sum ? parts.reduce((a,[v,wt])=>a+v*wt,0)/sum : 0;
}
const byScore = (a,b) => total(b)-total(a);
const noteOf = id => S.notes[id] || {};
const statusOf = id => noteOf(id).status || "todo";
const isRead = id => ["done","skip"].includes(statusOf(id));
const fmt1 = v => v==null ? "—" : (+v).toFixed(1).replace(/\.0$/,"");
function scoreTitle(p){ const s=p.scores||{}; return `相关 ${fmt1(s.rel)}${s.llm!=null?`，模型判断 ${fmt1(s.llm)}`:""}，影响 ${fmt1(s.impact)}，热度 ${fmt1(s.buzz)}`; }
const scoreEl = p => `<span class="score" title="${esc(scoreTitle(p))}"><b>${total(p).toFixed(1)}</b>综合</span>`;

/* ---------- 小部件 ---------- */
function authorsShort(p){ const a=p.authors||[]; return a.length>3 ? `${a.slice(0,2).join(", ")} 等 ${a.length} 人` : a.join(", "); }
function meta(p, full){
  const bits=[esc(full?(p.authors||[]).join(", "):authorsShort(p))];
  if(p.venue) bits.push(`<span class="v">${esc(venueText(p.venue))}</span>`);
  if(p.date) bits.push(esc(fmtDate(p.date)));
  if(p.signals) bits.push(esc(p.signals));
  return `<p class="meta">${bits.join("，")}</p>`;
}
function stamps(id){
  const st=statusOf(id), out=[];
  if(st==="reading") out.push(`<span class="stamp reading">在读</span>`);
  if(st==="done") out.push(`<span class="stamp done">已读</span>`);
  if(S.zotero[id]) out.push(`<span class="stamp z">已入 Zotero</span>`);
  return out.join("");
}
function checkBtn(id){
  const st=statusOf(id);
  return `<button class="check${st==="reading"?" half":""}" data-toggle="${esc(id)}" aria-pressed="${st==="done"}" title="${st==="done"?"已读，点一下改回待读":"标为已读"}" aria-label="标为已读">${CHECK_SVG}</button>`;
}
const zhSub = p => p.titleZh ? `<p class="zh-sub">${esc(p.titleZh)}</p>` : "";
const titleBtn = (p, cls="") => `<button class="hit ${cls}" data-open="${esc(p.id)}"><span class="ul">${esc(p.title)}</span></button>`;
function emptyBox(title, body, err){ return `<div class="empty${err?" err":""}"><strong>${title}</strong>${body?`<span>${body}</span>`:""}</div>`; }
function runBtn(job, label){ return S.features.run ? `<button class="btn" data-run="${job}">${label}</button>` : ""; }

/* ---------- 今日 ---------- */
function sectionsOf(day){
  const picks=(day.picks||[]).filter(id=>S.papers[id]);
  const plan=day.plan||[], byMode={};
  for(const it of plan){ (byMode[it.mode] ||= {mode:it.mode, minutes:0, task:it.task, ids:[]}); byMode[it.mode].minutes+= +it.minutes||0; byMode[it.mode].ids.push(...(it.paperIds||[])); }
  if(!plan.length) for(const id of picks){ const m=TIER_MODE[S.papers[id].tier]||"scan"; (byMode[m] ||= {mode:m, minutes:0, task:"", ids:[]}).ids.push(id); }
  const secs=Object.values(byMode).sort((a,b)=>(MODES[a.mode]?.order??9)-(MODES[b.mode]?.order??9));
  for(const s of secs){ s.ids=[...new Set(s.ids)].filter(id=>S.papers[id]); if(s.mode!=="note") s.ids.sort((a,b)=>byScore(S.papers[a],S.papers[b])); }
  return secs;
}
function strip(secs){
  const tot=secs.reduce((a,s)=>a+s.minutes,0);
  if(!tot) return "";
  const papers=new Set(secs.filter(s=>s.mode!=="note").flatMap(s=>s.ids));
  const done=[...papers].filter(isRead).length;
  const target = m => m==="note"||m==="deep" ? "lead" : m==="scan" ? "briefs" : m==="abstract" ? "second" : "lead";
  return `<section class="strip" aria-label="今天的阅读时间">
    <div class="strip-top"><span><b>${tot} 分钟</b>　今天的阅读计划</span><span>已读 ${done} / ${papers.size}</span></div>
    <div class="bars">${secs.map(s=>{
      const cells = s.mode==="note" ? [!!(noteOf(s.ids[0]).note||"").trim()] : s.ids.map(isRead);
      return `<button class="bar ${s.mode}" style="flex:${Math.max(s.minutes,5)}" data-jump="${target(s.mode)}" title="${esc(MODES[s.mode]?.name||s.mode)}，${s.minutes} 分钟">
        <span class="cells">${cells.map(on=>`<i class="${on?"on":""}"></i>`).join("")}</span>
        <span class="bar-label"><b><span class="full-name">${esc(MODES[s.mode]?.name||s.mode)}</span><span class="short">${esc(MODES[s.mode]?.short||s.mode)}</span></b><span class="m">${s.minutes} 分钟</span></span></button>`;
    }).join("")}</div>
  </section>`;
}
function leadStory(p, sec, noteSec){
  const st=statusOf(p.id), hasNote=(noteOf(p.id).note||"").trim();
  const minutes=sec.minutes+(noteSec?.minutes||0);
  return `<article class="lead" id="lead">
    <p class="kicker">精读<span class="min">${minutes} 分钟，其中 ${noteSec?.minutes||0} 分钟写笔记</span></p>
    <h3>${titleBtn(p)}${stamps(p.id)}</h3>
    ${zhSub(p)}
    ${meta(p)}
    ${p.cover?`<figure class="lead-fig"><button class="img" data-open="${esc(p.id)}" aria-label="打开这篇论文"><img src="${esc(p.cover.src)}" alt="${esc(p.cover.label||"")}" decoding="async" onerror="this.closest('figure').remove()"></button><figcaption>${esc(p.cover.label||"")}${p.cover.caption?`　${esc(p.cover.caption.slice(0,160))}${p.cover.caption.length>160?"…":""}`:""}<span class="credit">图：论文原图，来自 arXiv</span></figcaption></figure>`:""}
    <p class="lede">${esc(p.summary||(p.abstract||"").slice(0,420))}</p>
    ${p.why?`<blockquote class="pull"><small>为什么推荐给你</small>${esc(p.why)}</blockquote>`:""}
    ${p.tip?`<p class="howto"><b>怎么读</b>${esc(p.tip)}</p>`:""}
    <div class="lead-foot">
      ${p.pdf?`<a class="btn pri" href="${esc(p.pdf)}" target="_blank" rel="noopener">打开 PDF</a>`:""}
      ${st==="done"?"":`<button class="btn" data-setst="${esc(p.id)}" data-v="${st==="reading"?"done":"reading"}">${st==="reading"?"读完了":"开始读"}</button>`}

function planRail(secs){

  const target = m => m==="note"||m==="deep" ? "lead" : m==="scan" ? "briefs" : m==="abstract" ? "second" : "lead";
  return `<section class="rsect" aria-label="今天的阅读计划">

    <ul class="plan-rail">${secs.map(s=>{
      const cells = s.mode==="note" ? [!!(noteOf(s.ids[0]).note||"").trim()] : s.ids.map(isRead);
      return `<li><button class="bar ${s.mode}" data-jump="${target(s.mode)}"><span class="pn">${esc(MODES[s.mode]?.name||s.mode)}</span><span class="cells">${cells.map(on=>`<i class="${on?"on":""}"></i>`).join("")}</span><span class="pm">${s.minutes} 分钟</span></button></li>`;

}

function ago(iso){
  if(!iso) return "";
  const t=new Date(iso), h=(Date.now()-t)/36e5;
  if(h<1) return "刚刚";
  if(h<24) return `${Math.floor(h)} 小时前`;
  return `${t.getMonth()+1}月${t.getDate()}日`;
}

function viewLib(){
  const L=S.lib;
  if(L.list===null && !L.loading) loadLib();
  const list=(L.list||[]).map(id=>S.papers[id]).filter(Boolean);
  S.order=list.map(p=>p.id);
  return `<div class="search"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg><input type="search" id="lib-q" placeholder="搜标题、作者、要点或 arXiv 编号" value="${esc(L.q)}" aria-label="搜索论文"></div>
    <div class="filters">${[["","全部"],...STATUS].map(([k,l])=>`<button data-status="${k}" aria-pressed="${L.status===k}">${l}</button>`).join("")}<span class="faint" style="margin-left:auto">${L.list===null?"载入中…":`${L.total} 篇${L.total>list.length?`，先显示 ${list.length} 篇`:""}`}</span></div>
    ${list.length?`<ol class="archive">${libRows(list)}</ol>`
      :(L.list?`<div style="margin-top:24px">${emptyBox(L.q||L.status?"没有符合条件的论文":"论文库是空的", L.q||L.status?"换个关键词或状态试试。":"每日推荐过的论文都会进入这里。")}</div>`:"")}
    ${L.total>list.length?`<div class="actions" style="margin-top:18px"><button class="btn" id="lib-more" ${L.loading?"disabled":""}>再看 50 篇</button></div>`:""}`;
}
// 按推荐日期分组，日期只在组头出现一次
function libRows(list){
  let last=""; const out=[];
  for(const p of list){
    const d=(p.addedOn||p.date||"").slice(0,10);
    if(d!==last){ last=d; const n=list.filter(x=>(x.addedOn||x.date||"").slice(0,10)===d).length;
      out.push(`<li class="dh">${esc(d?longDate(d).replace("　"," "):"更早")}<span>${n} 篇</span></li>`); }
    out.push(`<li class="row${isRead(p.id)?" read":""}">${checkBtn(p.id)}<span class="t">${titleBtn(p)}${stamps(p.id)}</span>${scoreEl(p)}<p class="why">${esc(p.why||p.summary||"")}</p></li>`);
  }
  return out.join("");
}
let libTimer=null, libSeq=0;
async function loadLib(append){
  const L=S.lib, seq=++libSeq; L.loading=true;
  const off=append?(L.list||[]).length:0;
  try{
    const qs=new URLSearchParams({q:L.q, status:L.status, limit:"50", offset:String(off)});
    const r=await api(`/api/papers?${qs}`);
    if(seq!==libSeq) return;
    r.papers.forEach(p=>S.papers[p.id]=p);
    L.list=(append?L.list:[]).concat(r.papers.map(p=>p.id)); L.total=r.total;
  }catch(e){ if(seq===libSeq){ L.list=L.list||[]; toast(e.message); } }
  finally{ if(seq===libSeq){ L.loading=false; if(S.tab==="lib") render(); } }
}

function viewNotes(){

  if(!ids.length) return emptyBox("还没有笔记","打开一篇论文，用自己的话写 3 到 5 句：问题、核心 idea、关键结果、你的看法。笔记自动保存，会出现在这里。");
  ids.sort((a,b)=>(S.notes[b].updatedAt||"").localeCompare(S.notes[a].updatedAt||""));
  S.order=ids;
  return `<div class="letters">${ids.map(id=>{const p=S.papers[id],n=S.notes[id];
    const m=[fmtDate(n.updatedAt||""), n.status==="done"?"已读":n.status==="reading"?"在读":"", (n.flags||[]).join("、"), S.zotero[id]?"已入 Zotero":""].filter(Boolean);
    return `<button class="letter" data-open="${esc(id)}" data-focus="note"><p class="kicker">${esc(m.join("，"))}</p><span class="t">${esc(p.title)}</span><span class="n ${n.note?"":"faint"}">${esc(n.note||"还没写内容")}</span></button>`;}).join("")}</div>`;
